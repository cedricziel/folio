# Optional: every value below is also the built-in default.
# Environment variables override this file; see docs/configuration.md.

[server]
host = "127.0.0.1"
port = 3000
# Base URL used in webhook payload links; defaults to http://host:port
# public_url = "https://folio.example.com"

[database]
# sqlite:<path> or postgres://user:pass@host/db
url = "sqlite:folio.db?mode=rwc"

[storage]
path = "./data"

[ai]
# Provider: "openai", "anthropic", or "local"
provider = "openai"
# API keys are loaded from environment variables:
# - FOLIO_AI__OPENAI_API_KEY
# - FOLIO_AI__ANTHROPIC_API_KEY
