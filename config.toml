# Optional: every value below is also the built-in default.
# Environment variables override this file; see docs/configuration.md.

[server]
host = "127.0.0.1"
port = 3000
# Public base URL. Drives OAuth and OIDC redirects, the token issuer, secure cookies
# and webhook links; defaults to http://host:port
# public_url = "https://folio.example.com"

[database]
# sqlite:<path> or postgres://user:pass@host/db
url = "sqlite:folio.db?mode=rwc"

[storage]
path = "./data"

[ai]
# Provider: "openai", "anthropic", or "local"
provider = "openai"
# API keys are loaded from environment variables:
# - FOLIO_AI__OPENAI_API_KEY
# - FOLIO_AI__ANTHROPIC_API_KEY

[mcp]
# Serve the MCP endpoint at /mcp. Unset, it follows auth.required: on when sign-in is
# enforced, off otherwise. The "mcp.enabled" setting in the database overrides this.
# enabled = true
# Extra Host headers to accept besides loopback, e.g. ["folio.example.com"]
allowed_hosts = []
