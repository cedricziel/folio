name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - if: steps.release.outputs.prs_created == 'true'
        name: Sync Cargo.lock and the OpenAPI version with the release
        run: |
          cargo update --workspace --offline || cargo update --workspace
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python3 - "$version" <<'PY'
          import re, sys
          path = "openapi/openapi.json"
          spec = open(path).read()
          spec = re.sub(r'("info": \{.*?"version": ")[^"]*(")', lambda m: m.group(1) + sys.argv[1] + m.group(2), spec, count=1, flags=re.S)
          open(path, "w").write(spec)
          PY
          if ! git diff --quiet Cargo.lock openapi/openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync Cargo.lock and the OpenAPI version with the release"
            git push
          fi

  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release-please.outputs.version }}
      latest: ${{ !contains(needs.release-please.outputs.version, '-') }}

  binaries:
    name: binary (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: 0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --bin folio-app
      - name: Package
        run: |
          name="folio-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/release/folio-app config.toml LICENSE "dist/${name}/"
          cp -R static "dist/${name}/static"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Upload to release
        run: gh release upload "$TAG" folio-*.tar.gz folio-*.tar.gz.sha256 --clobber
