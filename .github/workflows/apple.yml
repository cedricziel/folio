name: Apple

# Pull requests that touch the Apple app, the API spec or the design tokens run the tests.
# TestFlight uploads run only for releases (called from release.yml) or by hand.
# Secrets: MATCH_DEPLOY_KEY (ssh key with read access to the certificates repo), MATCH_GIT_URL,
# MATCH_PASSWORD, MATCH_KEYCHAIN_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT.

on:
  pull_request:
    paths:
      - "apple/**"
      - "openapi/**"
      - "design/tokens.json"
      - ".github/workflows/apple.yml"
  workflow_dispatch:
    inputs:
      version:
        description: App version (CFBundleShortVersionString); empty keeps the project default
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: App version (CFBundleShortVersionString), the release version
        required: true
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  # The UI lanes compete for the few macos-26 runners, so a PR runs each only when it touches what
  # that lane builds: its fixture project, the app view it compiles, or FolioKit.
  changes:
    name: Changed Apple areas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classifications: ${{ steps.filter.outputs.classifications }}
      thumbnails: ${{ steps.filter.outputs.thumbnails }}
    steps:
      # The PR merge commit's first parent is the base tip, so HEAD^1..HEAD is exactly the PR's change.
      # --no-renames lists both paths of a moved file, so moving one out of a watched path still counts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        run: |
          classifications=false
          thumbnails=false
          while IFS= read -r file; do
            case "$file" in
              # The fixtures load FolioKit's view models, which reach across the whole package, and
              # build FolioAPI, whose openapi.json is a symlink to the root schema.
              .github/workflows/apple.yml | design/tokens.json | openapi/openapi.json | \
              apple/FolioKit/Package.* | apple/FolioKit/Sources/*)
                classifications=true; thumbnails=true ;;
              apple/ClassificationTests/* | apple/Folio/Sources/TaxonomyView.swift)
                classifications=true ;;
              apple/ThumbnailTests/* | apple/Folio/Sources/DocumentRowView.swift | \
              apple/FolioKit/Tests/FolioKitTests/MockFolioService.swift)
                thumbnails=true ;;
            esac
          done < <(git diff --no-renames --name-only HEAD^1 HEAD)
          printf 'classifications=%s\nthumbnails=%s\n' "$classifications" "$thumbnails" | tee -a "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.toolchain.xcode == '26.6' && 'test' || 'test (Xcode 27.1)' }}
    if: github.event_name == 'pull_request'
    concurrency:
      group: apple-test-${{ github.ref }}-${{ matrix.toolchain.xcode }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Releases stay on 26.6 until #198. The Xcode 27 leg runs the build, FolioKit tests and
        # navigation on iPhone and iPhone Duo; the other UI lanes stay on 26.6 to save runner time.
        toolchain:
          - { runner: macos-26, xcode: "26.6" }
          - { runner: xcode-27, xcode: "27.1" }
    runs-on: ${{ matrix.toolchain.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.toolchain.xcode }}.app/Contents/Developer
    # The build plus several navigation passes can pass 60 minutes on a loaded runner; the
    # FolioKit watchdog still stops a hung `swift test` after 15.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject screen and device-idiom layout checks
        run: |
          # OS 27 SDK builds resize on iPad, iPhone Duo and in iPhone Mirroring (#373).
          if grep -rnE 'UIScreen\.main|userInterfaceIdiom|UIDevice\.current\.orientation' Folio FolioKit/Sources; then
            echo "::error::Lay out by size class or container size, not by screen or device."
            exit 1
          fi
      - name: Report Apple toolchain
        run: |
          sw_vers
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR"
          xcrun xcodebuild -version
          xcrun swift --version
          xcrun xcodebuild -showsdks
          for sdk in iphoneos iphonesimulator macosx; do
            printf '%s SDK: ' "$sdk"
            xcrun --sdk "$sdk" --show-sdk-version
          done
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          working-directory: apple
          bundler-cache: true
      - run: brew install xcodegen
      - run: bundle exec fastlane test
        env:
          # FolioKit's `swift test` takes a few minutes; past this it counts as hung and its stacks are recorded.
          TEST_WATCHDOG_LIMIT: "900"
          TEST_WATCHDOG_DIR: ${{ github.workspace }}/apple/build/test-hang
      - name: Upload the stacks of a hung test run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-hang-${{ matrix.toolchain.xcode }}
          path: apple/build/test-hang
          if-no-files-found: ignore
      - name: Check the official build's identifiers
        run: scripts/check-build-settings.sh
      - name: Check associated domains for self-builds
        run: |
          local_entitlements=Folio/Resources/Folio-Local.entitlements
          trap 'rm -f "$local_entitlements"' EXIT
          FOLIO_ASSOCIATED_DOMAINS=folio.example.com scripts/associated-domains.sh
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains' "$local_entitlements" > "$RUNNER_TEMP/domains.txt"
          cat "$RUNNER_TEMP/domains.txt"
          test "$(grep -c 'applinks:' "$RUNNER_TEMP/domains.txt")" = 1
          grep -q 'applinks:folio.example.com' "$RUNNER_TEMP/domains.txt"
          rm "$local_entitlements"
          FOLIO_ASSOCIATED_DOMAINS= scripts/associated-domains.sh
          test ! -e "$local_entitlements"
      - name: Follow the self-build checklist with the example configuration
        run: |
          cleanup() {
            rm -f Folio/Config/Local.xcconfig Folio/Resources/Folio-Local.entitlements
            (cd Folio && xcodegen generate --quiet)
          }
          trap cleanup EXIT
          cp Folio/Config/Local.xcconfig.example Folio/Config/Local.xcconfig
          cd Folio && xcodegen generate && ../scripts/associated-domains.sh && cd ..
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains' Folio/Resources/Folio-Local.entitlements
          scripts/check-build-settings.sh --local
      # Releases build without the widget extension until its App ID and profiles exist (docs/apple-widgets.md).
      - name: Check the default project leaves the widget extension out
        run: "! grep -q FolioWidgets Folio/Folio.xcodeproj/project.pbxproj"
      - name: Check the widget extension's identifiers
        env:
          FOLIO_WIDGETS: "YES"
        run: scripts/check-build-settings.sh
      - name: Build with the widget extension
        working-directory: apple/Folio
        env:
          FOLIO_WIDGETS: "YES"
        run: |
          xcodegen generate
          grep -q FolioWidgets Folio.xcodeproj/project.pbxproj
          for destination in "generic/platform=iOS Simulator" "platform=macOS"; do
            xcrun xcodebuild build -project Folio.xcodeproj -scheme Folio -destination "$destination" \
              -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO
          done
      - name: Test navigation on iPhone and iPad (26.6) or iPhone Duo (27.1)
        # The 27.1 leg runs the whole suite twice (iPhone, then iPhone Duo).
        timeout-minutes: 40
        run: |
          verify_dir=$(mktemp -d)
          verify_device=""
          cleanup() {
            if [ -n "$verify_device" ]; then
              xcrun simctl shutdown "$verify_device" || true
              xcrun simctl delete "$verify_device" || true
            fi
            rm -rf "$verify_dir"
          }
          trap cleanup EXIT
          # The Xcode 27 image also carries a Duo-only iOS 27.1 runtime, so pick one that runs the device.
          phone=com.apple.CoreSimulator.SimDeviceType.iPhone-16
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and ".iOS-" in r["identifier"] and any(d["identifier"] == sys.argv[1] for d in r.get("supportedDeviceTypes", []))))' "$phone")
          verify_device=$(xcrun simctl create Folio-Navigation-CI "$phone" "$runtime")
          # A cold simulator can miss the UI-test runner's accessibility handshake; boot it fully first.
          xcrun simctl bootstatus "$verify_device" -b
          xcodegen generate --spec NavigationTests/project.yml --project "$verify_dir"
          xcrun xcodebuild test -project "$verify_dir/InboxNavigation.xcodeproj" -scheme Fixture \
            -destination "platform=iOS Simulator,id=$verify_device" \
            -derivedDataPath "$verify_dir/build" -clonedSourcePackagesDirPath "$verify_dir/packages" \
            -packageCachePath "$verify_dir/cache" -skipPackagePluginValidation -skipMacroValidation \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
          xcrun simctl shutdown "$verify_device" || true
          xcrun simctl delete "$verify_device"
          verify_device=""
          common=(-project "$verify_dir/InboxNavigation.xcodeproj" -scheme Fixture
            -derivedDataPath "$verify_dir/build" -clonedSourcePackagesDirPath "$verify_dir/packages"
            -packageCachePath "$verify_dir/cache" -skipPackagePluginValidation -skipMacroValidation
            -parallel-testing-enabled NO -test-timeouts-enabled YES
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES)
          if [ "${{ matrix.toolchain.xcode }}" = "26.6" ]; then
            tablet=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next(d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if "iPad Pro" in d["name"] and "13-inch" in d["name"]))')
            verify_device=$(xcrun simctl create Folio-iPad-Navigation-CI "$tablet" "$runtime")
            xcrun simctl bootstatus "$verify_device" -b
            xcrun xcodebuild test-without-building "${common[@]}" \
              -destination "platform=iOS Simulator,id=$verify_device" \
              -only-testing:NavigationTests/NavigationTests/testWideWindowKeepsDocumentListBesidePreview \
              -only-testing:NavigationTests/NavigationTests/testRefreshingTheListUpdatesTheSelectedDocumentDetails \
              -only-testing:NavigationTests/NavigationTests/testFilingBesideTheListKeepsTheDocumentOpen
          else
            # iPhone Duo ships as its own iOS 27.1 runtime; width-dependent tests skip themselves.
            duo=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next(d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if d["name"] == "iPhone Duo"))')
            duo_runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and any(d["identifier"] == sys.argv[1] for d in r.get("supportedDeviceTypes", []))))' "$duo")
            verify_device=$(xcrun simctl create Folio-Duo-Navigation-CI "$duo" "$duo_runtime")
            xcrun simctl bootstatus "$verify_device" -b
            xcrun xcodebuild test-without-building "${common[@]}" \
              -destination "platform=iOS Simulator,id=$verify_device"
          fi

  thumbnails:
    name: Thumbnail UI
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.thumbnails == 'true'
    concurrency:
      group: apple-thumbnails-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install xcodegen
      - name: Verify thumbnail rows on iPhone
        run: |
          verify_dir=$(mktemp -d)
          verify_device=""
          cleanup() {
            if [ -n "$verify_device" ]; then
              xcrun simctl shutdown "$verify_device" || true
              xcrun simctl delete "$verify_device" || true
            fi
            rm -rf "$verify_dir"
          }
          trap cleanup EXIT
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and ".iOS-" in r["identifier"]))')
          verify_device=$(xcrun simctl create Folio-Thumbnails-CI com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          xcrun simctl bootstatus "$verify_device" -b
          xcodegen generate --spec apple/ThumbnailTests/project.yml --project "$verify_dir"
          xcrun xcodebuild test -project "$verify_dir/ThumbnailPreview.xcodeproj" -scheme Fixture \
            -destination "platform=iOS Simulator,id=$verify_device" \
            -derivedDataPath "$verify_dir/build" -clonedSourcePackagesDirPath "$verify_dir/packages" \
            -packageCachePath "$verify_dir/cache" -skipPackagePluginValidation -skipMacroValidation \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "$RUNNER_TEMP/thumbnail-ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: thumbnail-ui-results
          path: ${{ runner.temp }}/thumbnail-ui.xcresult
          retention-days: 7

  classifications:
    name: Classification UI
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.classifications == 'true'
    concurrency:
      group: apple-classifications-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install xcodegen
      - name: Verify classification management on iPhone
        run: |
          verify_dir=$(mktemp -d)
          verify_device=""
          cleanup() {
            if [ -n "$verify_device" ]; then
              xcrun simctl shutdown "$verify_device" || true
              xcrun simctl delete "$verify_device" || true
            fi
            rm -rf "$verify_dir"
          }
          trap cleanup EXIT
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and ".iOS-" in r["identifier"]))')
          verify_device=$(xcrun simctl create Folio-Classifications-CI com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          xcrun simctl bootstatus "$verify_device" -b
          xcodegen generate --spec apple/ClassificationTests/project.yml --project "$verify_dir"
          xcrun xcodebuild test -project "$verify_dir/ClassificationPreview.xcodeproj" -scheme Fixture \
            -destination "platform=iOS Simulator,id=$verify_device" \
            -derivedDataPath "$verify_dir/build" -clonedSourcePackagesDirPath "$verify_dir/packages" \
            -packageCachePath "$verify_dir/cache" -skipPackagePluginValidation -skipMacroValidation \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "$RUNNER_TEMP/classification-ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: classification-ui-results
          path: ${{ runner.temp }}/classification-ui.xcresult
          retention-days: 7

  beta:
    name: TestFlight (iOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    # One TestFlight upload at a time; a queued run waits instead of cancelling a running upload.
    concurrency:
      group: apple-beta
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apple
    env: &signing
      APP_VERSION: ${{ inputs.version }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
    steps:
      # The changelog is built from git history since the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report Apple toolchain
        run: |
          sw_vers
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR"
          xcrun xcodebuild -version
          xcrun swift --version
          xcrun xcodebuild -showsdks
          for sdk in iphoneos iphonesimulator macosx; do
            printf '%s SDK: ' "$sdk"
            xcrun --sdk "$sdk" --show-sdk-version
          done
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          working-directory: apple
          bundler-cache: true
      - name: Configure SSH for the match repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run: brew install xcodegen
      - run: bundle exec fastlane beta

  beta-mac:
    name: TestFlight (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    # Stays non-blocking until the Mac installer certificate exists in the match repo.
    continue-on-error: true
    concurrency:
      group: apple-beta-mac
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apple
    env: *signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report Apple toolchain
        run: |
          sw_vers
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR"
          xcrun xcodebuild -version
          xcrun swift --version
          xcrun xcodebuild -showsdks
          for sdk in iphoneos iphonesimulator macosx; do
            printf '%s SDK: ' "$sdk"
            xcrun --sdk "$sdk" --show-sdk-version
          done
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          working-directory: apple
          bundler-cache: true
      - name: Configure SSH for the match repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run: brew install xcodegen
      - run: bundle exec fastlane beta_mac
