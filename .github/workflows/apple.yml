name: Apple

# Pull requests that touch the Apple app, the API spec or the design tokens run the tests.
# TestFlight uploads run only for releases (called from release.yml) or by hand.
# Secrets: MATCH_DEPLOY_KEY (ssh key with read access to the certificates repo), MATCH_GIT_URL,
# MATCH_PASSWORD, MATCH_KEYCHAIN_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT.

on:
  pull_request:
    paths:
      - "apple/**"
      - "openapi/**"
      - "design/tokens.json"
      - ".github/workflows/apple.yml"
  workflow_dispatch:
    inputs:
      version:
        description: App version (CFBundleShortVersionString); empty keeps the project default
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: App version (CFBundleShortVersionString), the release version
        required: true
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  test:
    if: github.event_name == 'pull_request'
    concurrency:
      group: apple-test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report Apple toolchain
        run: |
          sw_vers
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR"
          xcrun xcodebuild -version
          xcrun swift --version
          xcrun xcodebuild -showsdks
          for sdk in iphoneos iphonesimulator macosx; do
            printf '%s SDK: ' "$sdk"
            xcrun --sdk "$sdk" --show-sdk-version
          done
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          working-directory: apple
          bundler-cache: true
      - run: brew install xcodegen
      - run: bundle exec fastlane test
      - name: Test inbox navigation on iPhone
        timeout-minutes: 15
        run: |
          verify_dir=$(mktemp -d)
          verify_device=""
          cleanup() {
            if [ -n "$verify_device" ]; then
              xcrun simctl shutdown "$verify_device" || true
              xcrun simctl delete "$verify_device" || true
            fi
            rm -rf "$verify_dir"
          }
          trap cleanup EXIT
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and ".iOS-" in r["identifier"]))')
          verify_device=$(xcrun simctl create Folio-Navigation-CI com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          xcodegen generate --spec NavigationTests/project.yml --project "$verify_dir"
          xcrun xcodebuild test -project "$verify_dir/InboxNavigation.xcodeproj" -scheme Fixture \
            -destination "platform=iOS Simulator,id=$verify_device" \
            -derivedDataPath "$verify_dir/build" -clonedSourcePackagesDirPath "$verify_dir/packages" \
            -packageCachePath "$verify_dir/cache" -skipPackagePluginValidation -skipMacroValidation \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 45 CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES

  beta:
    name: TestFlight (iOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    # One TestFlight upload at a time; a queued run waits instead of cancelling a running upload.
    concurrency:
      group: apple-beta
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apple
    env: &signing
      APP_VERSION: ${{ inputs.version }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
    steps:
      # The changelog is built from git history since the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report Apple toolchain
        run: |
          sw_vers
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR"
          xcrun xcodebuild -version
          xcrun swift --version
          xcrun xcodebuild -showsdks
          for sdk in iphoneos iphonesimulator macosx; do
            printf '%s SDK: ' "$sdk"
            xcrun --sdk "$sdk" --show-sdk-version
          done
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          working-directory: apple
          bundler-cache: true
      - name: Configure SSH for the match repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run: brew install xcodegen
      - run: bundle exec fastlane beta

  beta-mac:
    name: TestFlight (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    # Stays non-blocking until the Mac installer certificate exists in the match repo.
    continue-on-error: true
    concurrency:
      group: apple-beta-mac
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apple
    env: *signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report Apple toolchain
        run: |
          sw_vers
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR"
          xcrun xcodebuild -version
          xcrun swift --version
          xcrun xcodebuild -showsdks
          for sdk in iphoneos iphonesimulator macosx; do
            printf '%s SDK: ' "$sdk"
            xcrun --sdk "$sdk" --show-sdk-version
          done
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          working-directory: apple
          bundler-cache: true
      - name: Configure SSH for the match repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run: brew install xcodegen
      - run: bundle exec fastlane beta_mac
