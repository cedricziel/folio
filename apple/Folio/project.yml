name: Folio
options:
  bundleIdPrefix: com.cedricziel
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
  createIntermediateGroups: true
configFiles:
  Debug: Config/Folio.xcconfig
  Release: Config/Folio.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: 0.14.0
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    DEVELOPMENT_TEAM: $(FOLIO_DEVELOPMENT_TEAM)
packages:
  FolioKit:
    path: ../FolioKit
targets:
  Folio:
    type: application
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: FolioKit
      - target: FolioShare
      - target: FolioFileProvider
    entitlements:
      path: Resources/Folio.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FOLIO_APP_GROUP)
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(FOLIO_BUNDLE_ID)
    info:
      path: Resources/Folio-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Folio
        FolioKeychainGroup: $(AppIdentifierPrefix)$(FOLIO_BUNDLE_ID)
        FolioAppGroup: $(FOLIO_APP_GROUP)
        FolioCallbackScheme: $(FOLIO_BUNDLE_ID)
        FolioPushEnabled: $(FOLIO_PUSH)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Folio uses the camera to scan paper documents.
        NSFaceIDUsageDescription: Folio uses Face ID to unlock your documents when App lock is enabled.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSUserActivityTypes:
          - com.cedricziel.folio.document
          - com.cedricziel.folio.library
          - com.cedricziel.folio.saved-view
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FOLIO_BUNDLE_ID)
        ENABLE_APP_SANDBOX: 'YES'
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: 'YES'
        ENABLE_USER_SELECTED_FILES: readwrite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APS_ENVIRONMENT: development
        FOLIO_PUSH: 'NO'
        FOLIO_ENTITLEMENTS_NO: $(FOLIO_APP_ENTITLEMENTS)
        FOLIO_ENTITLEMENTS_YES: Push/FolioPush.entitlements
        # XcodeGen writes CODE_SIGN_ENTITLEMENTS = entitlements.path into these settings itself, which overrides
        # a plain key here. A condition that matches every SDK takes precedence over it, so FOLIO_PUSH and a
        # self-build's FOLIO_APP_ENTITLEMENTS (Folio-Local.entitlements, see scripts/associated-domains.sh) apply.
        CODE_SIGN_ENTITLEMENTS[sdk=*]: $(FOLIO_ENTITLEMENTS_$(FOLIO_PUSH))
      configs:
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: $(FOLIO_RELEASE_SIGN_STYLE)
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: $(FOLIO_RELEASE_IDENTITY)
          CODE_SIGN_IDENTITY[sdk=macosx*]: $(FOLIO_RELEASE_IDENTITY)
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: $(FOLIO_PROFILE_APP_IOS)
          PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: $(FOLIO_PROFILE_APP_MACOS)
  FolioAuthTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/WebAuthenticator.swift
      - path: Sources/AppLock.swift
      - path: Sources/DeviceAuthenticator.swift
      - path: Sources/PDFPreview.swift
    dependencies:
      - package: FolioKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
  FolioProviderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ProviderTests
      - path: ../../e2e/fixtures/sample.pdf
        group: ProviderTestFixtures
      - path: FileProvider
      - path: ../FolioKit/Tests/FolioKitTests/MockFolioService.swift
        group: ProviderTestSupport
    dependencies:
      - package: FolioKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        SWIFT_VERSION: '5.0'
  FolioShare:
    type: app-extension
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: FolioKit
    entitlements:
      path: Resources/FolioShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FOLIO_APP_GROUP)
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(FOLIO_BUNDLE_ID)
    info:
      path: Resources/FolioShare-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Add to Folio
        FolioKeychainGroup: $(AppIdentifierPrefix)$(FOLIO_BUNDLE_ID)
        FolioAppGroup: $(FOLIO_APP_GROUP)
        FolioCallbackScheme: $(FOLIO_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FOLIO_BUNDLE_ID).share
        ENABLE_APP_SANDBOX: 'YES'
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: 'YES'
        ENABLE_USER_SELECTED_FILES: readonly
      configs:
        Release:
          CODE_SIGN_STYLE: $(FOLIO_RELEASE_SIGN_STYLE)
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: $(FOLIO_RELEASE_IDENTITY)
          CODE_SIGN_IDENTITY[sdk=macosx*]: $(FOLIO_RELEASE_IDENTITY)
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: $(FOLIO_PROFILE_SHARE_IOS)
          PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: $(FOLIO_PROFILE_SHARE_MACOS)
  FolioFileProvider:
    type: app-extension
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: FileProvider
    dependencies:
      - package: FolioKit
    entitlements:
      path: Resources/FolioFileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FOLIO_APP_GROUP)
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(FOLIO_BUNDLE_ID)
    info:
      path: Resources/FolioFileProvider-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Folio
        FolioKeychainGroup: $(AppIdentifierPrefix)$(FOLIO_BUNDLE_ID)
        FolioAppGroup: $(FOLIO_APP_GROUP)
        FolioCallbackScheme: $(FOLIO_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FolioFileProvider
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: $(FOLIO_APP_GROUP)
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: com.cedricziel.folio.keep-downloaded
              NSExtensionFileProviderActionName: Keep Downloaded
              NSExtensionFileProviderActionActivationRule: >-
                SUBQUERY(fileproviderItems, $item,
                $item.userInfo.canKeepDownloaded == YES AND
                $item.userInfo.keptDownloaded == NO).@count > 0
            - NSExtensionFileProviderActionIdentifier: com.cedricziel.folio.allow-eviction
              NSExtensionFileProviderActionName: Don't Keep Downloaded
              NSExtensionFileProviderActionActivationRule: >-
                SUBQUERY(fileproviderItems, $item, $item.userInfo.keptDownloaded
                == YES).@count > 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FOLIO_BUNDLE_ID).fileprovider
        ENABLE_APP_SANDBOX: 'YES'
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: 'YES'
        ENABLE_USER_SELECTED_FILES: readonly
        SWIFT_VERSION: '5.0'
      configs:
        Release:
          CODE_SIGN_STYLE: $(FOLIO_RELEASE_SIGN_STYLE)
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: $(FOLIO_RELEASE_IDENTITY)
          CODE_SIGN_IDENTITY[sdk=macosx*]: $(FOLIO_RELEASE_IDENTITY)
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: $(FOLIO_PROFILE_FILEPROVIDER_IOS)
          PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: $(FOLIO_PROFILE_FILEPROVIDER_MACOS)
schemes:
  Folio:
    build:
      targets:
        Folio: all
    test:
      targets:
        - FolioAuthTests
        - FolioProviderTests
