name: Folio
options:
  bundleIdPrefix: com.cedricziel
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: 0.6.0
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
    DEVELOPMENT_TEAM: WPW3QSLZ2F
packages:
  FolioKit:
    path: ../FolioKit
targets:
  Folio:
    type: application
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: FolioKit
      - target: FolioShare
      - target: FolioFileProvider
    entitlements:
      path: Resources/Folio.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cedricziel.folio
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cedricziel.folio
    info:
      path: Resources/Folio-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Folio
        FolioKeychainGroup: $(AppIdentifierPrefix)com.cedricziel.folio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Folio uses the camera to scan paper documents.
        NSFaceIDUsageDescription: Folio uses Face ID to unlock your documents when App lock is enabled.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.folio
        ENABLE_APP_SANDBOX: 'YES'
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: 'YES'
        ENABLE_USER_SELECTED_FILES: readwrite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: match AppStore com.cedricziel.folio
          PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: match AppStore com.cedricziel.folio macos
  FolioAuthTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/WebAuthenticator.swift
      - path: Sources/AppLock.swift
      - path: Sources/DeviceAuthenticator.swift
    dependencies:
      - package: FolioKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
  FolioProviderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ProviderTests
      - path: ../../e2e/fixtures/sample.pdf
        group: ProviderTestFixtures
      - path: FileProvider
      - path: ../FolioKit/Tests/FolioKitTests/MockFolioService.swift
        group: ProviderTestSupport
    dependencies:
      - package: FolioKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: 'YES'
        SWIFT_VERSION: '5.0'
  FolioShare:
    type: app-extension
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: FolioKit
    entitlements:
      path: Resources/FolioShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cedricziel.folio
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cedricziel.folio
    info:
      path: Resources/FolioShare-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Add to Folio
        FolioKeychainGroup: $(AppIdentifierPrefix)com.cedricziel.folio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.folio.share
        ENABLE_APP_SANDBOX: 'YES'
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: 'YES'
        ENABLE_USER_SELECTED_FILES: readonly
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: match AppStore com.cedricziel.folio.share
          PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: match AppStore com.cedricziel.folio.share macos
  FolioFileProvider:
    type: app-extension
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: FileProvider
    dependencies:
      - package: FolioKit
    entitlements:
      path: Resources/FolioFileProvider.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cedricziel.folio
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cedricziel.folio
    info:
      path: Resources/FolioFileProvider-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Folio
        FolioKeychainGroup: $(AppIdentifierPrefix)com.cedricziel.folio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FolioFileProvider
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: group.com.cedricziel.folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.folio.fileprovider
        ENABLE_APP_SANDBOX: 'YES'
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: 'YES'
        ENABLE_USER_SELECTED_FILES: readonly
        SWIFT_VERSION: '5.0'
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: match AppStore com.cedricziel.folio.fileprovider
          PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: match AppStore com.cedricziel.folio.fileprovider macos
schemes:
  Folio:
    build:
      targets:
        Folio: all
    test:
      targets:
        - FolioAuthTests
        - FolioProviderTests
