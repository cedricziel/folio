name: Folio
options:
  bundleIdPrefix: com.cedricziel
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: WPW3QSLZ2F
packages:
  FolioKit:
    path: ../FolioKit
targets:
  Folio:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
    dependencies:
      - package: FolioKit
      - target: FolioShare
        destinationFilters: [iOS]
    entitlements:
      path: Resources/Folio.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cedricziel.folio]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Resources/Folio-Info.plist
      properties:
        CFBundleDisplayName: Folio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Folio uses the camera to scan paper documents.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.folio
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": match AppStore com.cedricziel.folio
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": match AppStore com.cedricziel.folio macos
  FolioShare:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: ShareExtension
    dependencies:
      - package: FolioKit
    entitlements:
      path: Resources/FolioShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.cedricziel.folio]
    info:
      path: Resources/FolioShare-Info.plist
      properties:
        CFBundleDisplayName: Add to Folio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsImageWithMaxCount: 5
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedricziel.folio.share
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.cedricziel.folio.share
schemes:
  Folio:
    build:
      targets:
        Folio: all
    test:
      targets: []
