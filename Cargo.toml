[workspace]
resolver = "2"
members = [
    "crates/folio-core",
    "crates/folio-infra",
    "crates/folio-api",
    "crates/folio-auth",
    "crates/folio-mcp",
    "folio-app",
    "xtask",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Folio Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
tower-livereload = "0.10"

# HTML templating (for HTMX responses)
askama = "0.16"
askama_axum = "0.4"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "uuid", "chrono", "tls-native-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Configuration
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP
rmcp = { version = "3.8", default-features = false }
base64 = "0.22"

# Utilities
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

# HTTP client (for AI APIs)
reqwest = { version = "0.13", features = ["json"] }

# OpenAPI
utoipa = { version = "6", features = ["uuid", "chrono", "axum_extras"] }
utoipa-scalar = "0.4"

# Embedded static assets
rust-embed = { version = "8", features = ["mime-guess"] }

# Image processing
image = "0.25"

# Workspace crates
folio-core = { path = "crates/folio-core" }
folio-infra = { path = "crates/folio-infra" }
folio-api = { path = "crates/folio-api" }
folio-auth = { path = "crates/folio-auth" }
folio-mcp = { path = "crates/folio-mcp" }
