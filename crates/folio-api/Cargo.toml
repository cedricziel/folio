[package]
name = "folio-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Core domain
folio-core = { workspace = true, features = ["openapi"] }
folio-infra = { workspace = true }
folio-auth = { workspace = true }

# Async runtime
reqwest = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tower-http = { workspace = true }
tower-livereload = { workspace = true }

# HTML templating
askama = { workspace = true }
askama_axum = { workspace = true }

# Embedded static assets
rust-embed = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Utilities
uuid = { workspace = true }
url = "2"
base64 = { workspace = true }

# Async traits
async-trait = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
totp-rs = { version = "6", features = ["otpauth"] }
webauthn-authenticator-rs = { version = "0.6", features = ["softpasskey"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { workspace = true }
sqlx = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
base64 = "0.23"
sha2 = "0.11"
tempfile = "3"
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["test-util"] }
