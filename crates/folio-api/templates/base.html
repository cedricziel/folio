<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Folio{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="module">
        import * as Turbo from 'https://esm.sh/@hotwired/turbo@8.0.12';
        import { Application, Controller } from 'https://esm.sh/@hotwired/stimulus@3.2.2';

        // Initialize Stimulus
        window.Stimulus = Application.start();

        // Upload Controller
        Stimulus.register("upload", class extends Controller {
            static targets = ["form", "button", "status"]

            submit(event) {
                this.buttonTarget.disabled = true;
                this.buttonTarget.textContent = "Uploading...";
                if (this.hasStatusTarget) {
                    this.statusTarget.textContent = "Processing document...";
                }
            }

            reset() {
                this.buttonTarget.disabled = false;
                this.buttonTarget.textContent = "Upload";
                if (this.hasStatusTarget) {
                    this.statusTarget.textContent = "";
                }
                this.formTarget.reset();
            }
        });

        // Confirm Controller
        Stimulus.register("confirm", class extends Controller {
            static values = { message: String }

            confirm(event) {
                if (!window.confirm(this.messageValue || "Are you sure?")) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            }
        });

        // Flash Controller (auto-dismiss)
        Stimulus.register("flash", class extends Controller {
            static values = { delay: { type: Number, default: 5000 } }

            connect() {
                setTimeout(() => this.dismiss(), this.delayValue);
            }

            dismiss() {
                this.element.remove();
            }
        });

        // Toast Controller (notification system)
        Stimulus.register("toast", class extends Controller {
            static targets = ["container"]

            show(message, type = "info", duration = 5000) {
                const toast = document.createElement("div");
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `
                    <span class="toast-message">${this.escapeHtml(message)}</span>
                    <button type="button" class="toast-close" onclick="this.parentElement.remove()">&times;</button>
                `;
                this.containerTarget.appendChild(toast);

                // Animate in
                requestAnimationFrame(() => toast.classList.add("toast-visible"));

                // Auto dismiss
                if (duration > 0) {
                    setTimeout(() => {
                        toast.classList.remove("toast-visible");
                        setTimeout(() => toast.remove(), 300);
                    }, duration);
                }
            }

            escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }
        });

        // Global toast helper
        window.showToast = (message, type = "info", duration = 5000) => {
            const toastController = document.querySelector("[data-controller~='toast']");
            if (toastController) {
                const controller = window.Stimulus.getControllerForElementAndIdentifier(toastController, "toast");
                controller?.show(message, type, duration);
            }
        };

        // Search Controller (header search with clear)
        Stimulus.register("search", class extends Controller {
            static targets = ["input", "clear", "form"]

            connect() {
                this.updateClearButton();
            }

            input() {
                this.updateClearButton();
            }

            updateClearButton() {
                if (this.hasClearTarget) {
                    this.clearTarget.style.display = this.inputTarget.value ? "flex" : "none";
                }
            }

            clear() {
                this.inputTarget.value = "";
                this.updateClearButton();
                this.inputTarget.focus();
                // Reset to show all documents
                const frame = document.querySelector("turbo-frame#documents-list");
                if (frame) {
                    frame.src = "/documents";
                }
            }

            submit(event) {
                if (!this.inputTarget.value.trim()) {
                    event.preventDefault();
                    this.clear();
                }
            }
        });

        // Upload Modal Controller
        Stimulus.register("upload-modal", class extends Controller {
            static targets = ["modal", "form", "button", "status"]

            open() {
                if (this.hasModalTarget) {
                    this.modalTarget.classList.add("active");
                    document.body.style.overflow = "hidden";
                }
            }

            close() {
                if (this.hasModalTarget) {
                    this.modalTarget.classList.remove("active");
                    document.body.style.overflow = "";
                }
            }

            backdropClick(event) {
                if (event.target === this.modalTarget) {
                    this.close();
                }
            }

            submit(event) {
                if (this.hasButtonTarget) {
                    this.buttonTarget.disabled = true;
                    this.buttonTarget.textContent = "Uploading...";
                }
                if (this.hasStatusTarget) {
                    this.statusTarget.textContent = "Processing document...";
                }
            }

            reset() {
                if (this.hasButtonTarget) {
                    this.buttonTarget.disabled = false;
                    this.buttonTarget.textContent = "Upload";
                }
                if (this.hasStatusTarget) {
                    this.statusTarget.textContent = "";
                }
                if (this.hasFormTarget) {
                    this.formTarget.reset();
                }
                this.close();
                window.showToast("Document uploaded successfully!", "success");
            }
        });

        // Password Toggle Controller
        Stimulus.register("password-toggle", class extends Controller {
            static targets = ["input", "icon"]

            toggle() {
                const isPassword = this.inputTarget.type === "password";
                this.inputTarget.type = isPassword ? "text" : "password";
                if (this.hasIconTarget) {
                    this.iconTarget.innerHTML = isPassword ? this.hideIcon() : this.showIcon();
                }
            }

            showIcon() {
                return `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
            }

            hideIcon() {
                return `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
            }
        });

        // Settings Form Controller
        Stimulus.register("settings-form", class extends Controller {
            static targets = ["provider", "openaiFields", "anthropicFields", "button", "status"]

            connect() {
                this.providerChanged();
            }

            providerChanged() {
                const provider = this.providerTarget.value;

                if (this.hasOpenaiFieldsTarget) {
                    this.openaiFieldsTarget.style.display = provider === "openai" ? "" : "none";
                }
                if (this.hasAnthropicFieldsTarget) {
                    this.anthropicFieldsTarget.style.display = provider === "anthropic" ? "" : "none";
                }
            }

            submit() {
                if (this.hasButtonTarget) {
                    this.buttonTarget.disabled = true;
                    this.buttonTarget.textContent = "Saving...";
                }
            }

            complete() {
                if (this.hasButtonTarget) {
                    this.buttonTarget.disabled = false;
                    this.buttonTarget.textContent = "Save Settings";
                }
            }
        });

        // View Toggle Controller (list/gallery)
        Stimulus.register("view-toggle", class extends Controller {
            static targets = ["list", "listBtn", "galleryBtn"]
            static values = { view: { type: String, default: "list" } }

            connect() {
                // Load saved preference
                const saved = localStorage.getItem("folio-view-mode");
                if (saved) {
                    this.viewValue = saved;
                }
                this.updateView();
            }

            // Re-apply view when list target is replaced (e.g., after Turbo frame reload)
            listTargetConnected() {
                this.updateView();
            }

            showList() {
                this.viewValue = "list";
                this.save();
                this.updateView();
            }

            showGallery() {
                this.viewValue = "gallery";
                this.save();
                this.updateView();
            }

            save() {
                localStorage.setItem("folio-view-mode", this.viewValue);
            }

            updateView() {
                const isList = this.viewValue === "list";

                if (this.hasListTarget) {
                    this.listTarget.classList.toggle("view-list", isList);
                    this.listTarget.classList.toggle("view-gallery", !isList);
                }

                if (this.hasListBtnTarget && this.hasGalleryBtnTarget) {
                    this.listBtnTarget.classList.toggle("active", isList);
                    this.galleryBtnTarget.classList.toggle("active", !isList);
                }
            }
        });

        // Dropzone Controller (full-page drag and drop)
        Stimulus.register("dropzone", class extends Controller {
            static targets = ["overlay", "fileInput", "queue", "queueList"]
            static values = { uploading: { type: Boolean, default: false } }

            connect() {
                this.dragCounter = 0;
                this.uploadQueue = [];
                this.isProcessing = false;
            }

            dragenter(event) {
                event.preventDefault();
                this.dragCounter++;
                if (this.dragCounter === 1) {
                    this.showOverlay();
                }
            }

            dragleave(event) {
                event.preventDefault();
                this.dragCounter--;
                if (this.dragCounter === 0) {
                    this.hideOverlay();
                }
            }

            dragover(event) {
                event.preventDefault();
                event.dataTransfer.dropEffect = "copy";
            }

            drop(event) {
                event.preventDefault();
                this.dragCounter = 0;
                this.hideOverlay();

                const files = Array.from(event.dataTransfer.files);
                if (files.length > 0) {
                    this.queueFiles(files);
                }
            }

            showOverlay() {
                if (this.hasOverlayTarget) {
                    this.overlayTarget.classList.add("active");
                }
            }

            hideOverlay() {
                if (this.hasOverlayTarget) {
                    this.overlayTarget.classList.remove("active");
                }
            }

            queueFiles(files) {
                files.forEach(file => {
                    const id = Date.now() + Math.random().toString(36).substr(2, 9);
                    this.uploadQueue.push({ id, file, status: "pending" });
                    this.addToQueueUI(id, file);
                });

                this.showQueue();
                this.processQueue();
            }

            addToQueueUI(id, file) {
                if (!this.hasQueueListTarget) return;

                const item = document.createElement("div");
                item.className = "queue-item";
                item.dataset.queueId = id;
                item.innerHTML = `
                    <span class="queue-item-name">${this.escapeHtml(file.name)}</span>
                    <div class="queue-item-progress">
                        <div class="queue-item-progress-bar" style="width: 0%"></div>
                    </div>
                    <span class="queue-item-status">Pending</span>
                `;
                this.queueListTarget.appendChild(item);
            }

            updateQueueItemStatus(id, status, message) {
                const item = this.queueListTarget?.querySelector(`[data-queue-id="${id}"]`);
                if (item) {
                    const statusEl = item.querySelector(".queue-item-status");
                    statusEl.textContent = message;
                    statusEl.className = `queue-item-status ${status}`;
                }
            }

            updateQueueItemProgress(id, percent) {
                const item = this.queueListTarget?.querySelector(`[data-queue-id="${id}"]`);
                if (item) {
                    const progressBar = item.querySelector(".queue-item-progress-bar");
                    if (progressBar) {
                        progressBar.style.width = `${percent}%`;
                    }
                }
            }

            showQueue() {
                if (this.hasQueueTarget) {
                    this.queueTarget.classList.add("active");
                }
            }

            hideQueue() {
                if (this.hasQueueTarget) {
                    this.queueTarget.classList.remove("active");
                }
            }

            clearQueue() {
                this.uploadQueue = [];
                if (this.hasQueueListTarget) {
                    this.queueListTarget.innerHTML = "";
                }
                this.hideQueue();
            }

            async processQueue() {
                if (this.isProcessing) return;
                this.isProcessing = true;

                while (this.uploadQueue.length > 0) {
                    const item = this.uploadQueue.find(i => i.status === "pending");
                    if (!item) break;

                    item.status = "uploading";
                    this.updateQueueItemStatus(item.id, "uploading", "0%");

                    try {
                        await this.uploadFile(item.file, item.id);
                        item.status = "done";
                        this.updateQueueItemProgress(item.id, 100);
                        this.updateQueueItemStatus(item.id, "done", "Done");
                        window.showToast?.(`"${item.file.name}" uploaded successfully`, "success");
                    } catch (error) {
                        item.status = "error";
                        this.updateQueueItemStatus(item.id, "error", "Failed");
                        window.showToast?.(`Failed to upload "${item.file.name}"`, "error");
                        console.error("Upload failed:", error);
                    }
                }

                this.isProcessing = false;

                // Refresh the document list
                const frame = document.querySelector("turbo-frame#documents-list");
                if (frame) {
                    frame.src = "/documents";
                }
            }

            async uploadFile(file, id) {
                return new Promise((resolve, reject) => {
                    const formData = new FormData();
                    formData.append("file", file);
                    formData.append("title", file.name);

                    const xhr = new XMLHttpRequest();

                    xhr.upload.addEventListener("progress", (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            this.updateQueueItemProgress(id, percent);
                            this.updateQueueItemStatus(id, "uploading", `${percent}%`);
                        }
                    });

                    xhr.addEventListener("load", () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            resolve(xhr.response);
                        } else {
                            reject(new Error(`Upload failed: ${xhr.status}`));
                        }
                    });

                    xhr.addEventListener("error", () => {
                        reject(new Error("Upload failed: Network error"));
                    });

                    xhr.open("POST", "/documents/upload");
                    xhr.setRequestHeader("Accept", "text/vnd.turbo-stream.html");
                    xhr.send(formData);
                });
            }

            escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }
        });

        // SSE Controller for real-time updates
        Stimulus.register("sse", class extends Controller {
            connect() {
                this.connectSSE();
            }

            disconnect() {
                this.closeSSE();
            }

            connectSSE() {
                this.eventSource = new EventSource("/events");

                this.eventSource.addEventListener("thumbnail_ready", (e) => {
                    this.handleDocumentUpdate(e);
                });

                this.eventSource.addEventListener("ocr_complete", (e) => {
                    this.handleDocumentUpdate(e);
                });

                this.eventSource.addEventListener("updated", (e) => {
                    this.handleDocumentUpdate(e);
                });

                this.eventSource.addEventListener("created", (e) => {
                    this.handleDocumentUpdate(e);
                });

                this.eventSource.addEventListener("deleted", (e) => {
                    this.handleDocumentUpdate(e);
                });

                this.eventSource.onerror = (e) => {
                    console.log("SSE connection error, will retry...");
                    this.closeSSE();
                    // Reconnect after 5 seconds
                    setTimeout(() => this.connectSSE(), 5000);
                };
            }

            closeSSE() {
                if (this.eventSource) {
                    this.eventSource.close();
                    this.eventSource = null;
                }
            }

            handleDocumentUpdate(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log("Document event:", event.type, data);

                    // Refresh the documents list frame
                    const frame = document.querySelector("turbo-frame#documents-list");
                    if (frame) {
                        frame.src = "/documents";
                    }
                } catch (e) {
                    console.error("Failed to parse SSE event:", e);
                }
            }
        });

        // Tags Controller (manage document tags via modal)
        Stimulus.register("tags", class extends Controller {
            static targets = ["modal", "list", "currentTags", "availableTags", "empty"]
            static values = { documentId: String }

            openModal() {
                if (this.hasModalTarget) {
                    this.modalTarget.classList.add("active");
                    document.body.style.overflow = "hidden";
                }
            }

            closeModal() {
                if (this.hasModalTarget) {
                    this.modalTarget.classList.remove("active");
                    document.body.style.overflow = "";
                }
            }

            backdropClick(event) {
                if (event.target === this.modalTarget) {
                    this.closeModal();
                }
            }

            async addTag(event) {
                const tagId = event.currentTarget.dataset.tagId;
                const tagName = event.currentTarget.dataset.tagName;
                const tagColor = event.currentTarget.dataset.tagColor;

                try {
                    const formData = new FormData();
                    formData.append("tag_id", tagId);

                    const response = await fetch(`/documents/${this.documentIdValue}/tags`, {
                        method: "POST",
                        body: formData
                    });

                    if (response.ok || response.redirected) {
                        // Add tag to UI
                        this.addTagToUI(tagId, tagName, tagColor);
                        window.showToast?.(`Tag "${tagName}" added`, "success");
                    } else {
                        throw new Error("Failed to add tag");
                    }
                } catch (error) {
                    console.error("Error adding tag:", error);
                    window.showToast?.("Failed to add tag", "error");
                }
            }

            async removeTag(event) {
                const tagId = event.currentTarget.dataset.tagId;

                try {
                    const response = await fetch(`/documents/${this.documentIdValue}/tags/${tagId}`, {
                        method: "POST"
                    });

                    if (response.ok || response.redirected) {
                        // Remove tag from UI
                        this.removeTagFromUI(tagId);
                        window.showToast?.("Tag removed", "success");
                    } else {
                        throw new Error("Failed to remove tag");
                    }
                } catch (error) {
                    console.error("Error removing tag:", error);
                    window.showToast?.("Failed to remove tag", "error");
                }
            }

            addTagToUI(tagId, tagName, tagColor) {
                // Remove "No tags" placeholder
                if (this.hasEmptyTarget) {
                    this.emptyTarget.remove();
                }
                const emptyInModal = this.currentTagsTarget?.querySelector(".doc-tags-empty");
                if (emptyInModal) {
                    emptyInModal.remove();
                }

                // Create tag element
                const tagHtml = `
                    <span class="doc-tag" data-tag-id="${tagId}" ${tagColor ? `style="background-color: ${tagColor}; color: white;"` : ""}>
                        ${this.escapeHtml(tagName)}
                        <button type="button" class="doc-tag-remove" title="Remove tag" data-action="click->tags#removeTag" data-tag-id="${tagId}">&times;</button>
                    </span>
                `;

                // Add to main list
                if (this.hasListTarget) {
                    this.listTarget.insertAdjacentHTML("beforeend", tagHtml);
                }

                // Add to modal current tags
                if (this.hasCurrentTagsTarget) {
                    this.currentTagsTarget.insertAdjacentHTML("beforeend", tagHtml);
                }

                // Hide the tag in available tags
                const availableTag = this.availableTagsTarget?.querySelector(`[data-tag-id="${tagId}"]`);
                if (availableTag) {
                    availableTag.style.display = "none";
                }
            }

            removeTagFromUI(tagId) {
                // Remove from main list
                const tagInList = this.listTarget?.querySelector(`[data-tag-id="${tagId}"]`);
                if (tagInList) {
                    tagInList.remove();
                }

                // Remove from modal current tags
                const tagInModal = this.currentTagsTarget?.querySelector(`[data-tag-id="${tagId}"]`);
                if (tagInModal) {
                    tagInModal.remove();
                }

                // Show the tag in available tags again
                const availableTag = this.availableTagsTarget?.querySelector(`[data-tag-id="${tagId}"]`);
                if (availableTag) {
                    availableTag.style.display = "";
                }

                // Show "No tags" if empty
                if (this.hasListTarget && this.listTarget.children.length === 0) {
                    this.listTarget.innerHTML = '<span class="doc-tags-empty" data-tags-target="empty">No tags</span>';
                }
                if (this.hasCurrentTagsTarget && this.currentTagsTarget.querySelectorAll(".doc-tag").length === 0) {
                    this.currentTagsTarget.innerHTML = '<span class="doc-tags-empty">No tags assigned</span>';
                }
            }

            escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }
        });

        // Page Viewer Controller (multi-page document navigation)
        Stimulus.register("page-viewer", class extends Controller {
            static targets = ["image", "currentPage", "prevBtn", "nextBtn"]
            static values = { documentId: String, pageCount: { type: Number, default: 1 } }

            connect() {
                this.currentPage = 1;
                this.updateButtons();
            }

            prevPage() {
                if (this.currentPage > 1) {
                    this.currentPage--;
                    this.loadPage();
                }
            }

            nextPage() {
                if (this.currentPage < this.pageCountValue) {
                    this.currentPage++;
                    this.loadPage();
                }
            }

            loadPage() {
                if (this.hasImageTarget) {
                    // Add loading state
                    this.imageTarget.style.opacity = "0.5";

                    const newSrc = `/documents/${this.documentIdValue}/page/${this.currentPage}/thumbnail`;
                    this.imageTarget.src = newSrc;

                    this.imageTarget.onload = () => {
                        this.imageTarget.style.opacity = "1";
                    };
                }

                if (this.hasCurrentPageTarget) {
                    this.currentPageTarget.textContent = this.currentPage;
                }

                this.updateButtons();
            }

            updateButtons() {
                if (this.hasPrevBtnTarget) {
                    this.prevBtnTarget.disabled = this.currentPage <= 1;
                }
                if (this.hasNextBtnTarget) {
                    this.nextBtnTarget.disabled = this.currentPage >= this.pageCountValue;
                }
            }
        });
    </script>
</head>
<body data-controller="dropzone sse toast upload-modal"
      data-action="dragenter->dropzone#dragenter dragleave->dropzone#dragleave dragover->dropzone#dragover drop->dropzone#drop">

    <!-- Toast container -->
    <div class="toast-container" data-toast-target="container"></div>

    <!-- Drop overlay -->
    <div class="dropzone-overlay" data-dropzone-target="overlay">
        <div class="dropzone-overlay-content">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <p>Drop files to upload</p>
        </div>
    </div>

    <!-- Upload queue panel -->
    <div class="upload-queue" data-dropzone-target="queue">
        <div class="upload-queue-header">
            <h3>Upload Queue</h3>
            <button type="button" class="upload-queue-close" data-action="click->dropzone#clearQueue">&times;</button>
        </div>
        <div class="upload-queue-list" data-dropzone-target="queueList"></div>
    </div>

    <!-- Upload modal -->
    <div class="upload-modal" data-upload-modal-target="modal" data-action="click->upload-modal#backdropClick">
        <div class="upload-modal-content">
            <div class="upload-modal-header">
                <h2>Upload Document</h2>
                <button type="button" class="upload-modal-close" data-action="click->upload-modal#close">&times;</button>
            </div>
            <form action="/documents/upload" method="post" enctype="multipart/form-data"
                  data-upload-modal-target="form"
                  data-action="turbo:submit-start->upload-modal#submit turbo:submit-end->upload-modal#reset">
                <div class="form-group">
                    <label for="modal-title">Title (optional)</label>
                    <input type="text" id="modal-title" name="title" placeholder="Document title">
                </div>
                <div class="form-group">
                    <label for="modal-file">File</label>
                    <input type="file" id="modal-file" name="file" required accept="image/*,.pdf">
                    <span class="form-hint">Supports images and PDFs with automatic text extraction</span>
                </div>
                <div class="upload-modal-actions">
                    <button type="button" class="btn-secondary" data-action="click->upload-modal#close">Cancel</button>
                    <button type="submit" data-upload-modal-target="button">Upload</button>
                </div>
                <span data-upload-modal-target="status" class="upload-status"></span>
            </form>
        </div>
    </div>

    <header>
        <div class="header-content">
            <div class="header-brand">
                <h1><a href="/">📄 Folio</a></h1>
            </div>
            <div class="header-search" data-controller="search">
                <form action="/documents/search" method="get" data-turbo-frame="documents-list"
                      data-search-target="form" data-action="submit->search#submit">
                    <div class="search-input-wrapper">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" name="q" placeholder="Search documents..."
                               data-search-target="input" data-action="input->search#input"
                               autocomplete="off">
                        <button type="button" class="search-clear" data-search-target="clear"
                                data-action="click->search#clear" style="display: none;" aria-label="Clear search">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
            <nav class="header-nav">
                <a href="/manage" class="nav-link" aria-label="Manage">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                        <line x1="7" y1="7" x2="7.01" y2="7"/>
                    </svg>
                </a>
                <a href="/settings" class="nav-link" aria-label="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </a>
            </nav>
        </div>
    </header>

    <!-- FAB Upload Button -->
    <button type="button" class="fab" data-action="click->upload-modal#open" aria-label="Upload document">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
    </button>

    {% block flash %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Folio - A stripped-down, AI-native document management system</p>
    </footer>
</body>
</html>
