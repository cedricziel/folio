{% import "partials/icons.html" as icons %}
<turbo-frame id="document-types-list">
    <ul class="manage-list">
        {% if document_types.is_empty() %}
        <li class="manage-list-empty">No types yet</li>
        {% else %}
        {% for doc_type in document_types %}
        <li class="manage-list-item" id="document-type-{{ doc_type.id }}">
            <span class="manage-item-name">{{ doc_type.name }}</span>
            <div class="manage-item-actions">
                <button type="button" class="f-btn f-btn-quiet icon-btn" aria-label="Rename document-type {{ doc_type.name }}"
                        onclick="this.closest('li').querySelector('.manage-edit-form').classList.toggle('active')">{% call icons::pencil() %}</button>
                <form action="/manage/document_types/{{ doc_type.id }}/delete" method="post" class="inline-form"
                      data-controller="confirm"
                      data-confirm-message-value="Delete document-type '{{ doc_type.name }}'?"
                      data-action="submit->confirm#confirm"
                      data-turbo-frame="document-types-list">
                    <button type="submit" class="f-btn f-btn-quiet f-btn-danger icon-btn" aria-label="Delete document-type {{ doc_type.name }}">{% call icons::trash() %}</button>
                </form>
            </div>
            <div class="manage-edit-form">
                <form action="/manage/document_types/{{ doc_type.id }}/update" method="post"
                      data-turbo-frame="document-types-list">
                    <label class="sr-only" for="edit-document-type-{{ doc_type.id }}">Name</label>
                    <input class="input" id="edit-document-type-{{ doc_type.id }}" type="text" name="name" value="{{ doc_type.name }}" required>
                    <div class="manage-edit-actions">
                        <button type="submit" class="f-btn f-btn-primary">Save</button>
                        <button type="button" class="f-btn f-btn-quiet"
                                onclick="this.closest('.manage-edit-form').classList.remove('active')">Cancel</button>
                    </div>
                </form>
            </div>
        </li>
        {% endfor %}
        {% endif %}
    </ul>
</turbo-frame>
