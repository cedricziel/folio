<div class="manage-edit-inline">
    <form action="/manage/document_types/{{ document_type.id }}/update" method="post"
          data-turbo-frame="document-types-list">
        <input type="text" name="name" value="{{ document_type.name }}" required autofocus>
        <div class="manage-edit-actions">
            <button type="submit" class="btn-small">Save</button>
            <a href="/manage/document_types" class="btn-small btn-secondary" data-turbo-frame="document-types-list">Cancel</a>
        </div>
    </form>
</div>
