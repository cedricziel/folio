<turbo-frame id="correspondents-list">
    <ul class="manage-list">
        {% if correspondents.is_empty() %}
        <li class="manage-list-empty">No correspondents yet</li>
        {% else %}
        {% for correspondent in correspondents %}
        <li class="manage-list-item" id="correspondent-{{ correspondent.id }}">
            <span class="manage-item-name">{{ correspondent.name }}</span>
            <div class="manage-item-actions">
                <button type="button" class="manage-btn-edit"
                        data-turbo-frame="correspondent-edit-{{ correspondent.id }}"
                        onclick="this.closest('li').querySelector('.manage-edit-form').classList.toggle('active')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                </button>
                <form action="/manage/correspondents/{{ correspondent.id }}/delete" method="post" class="inline-form"
                      data-controller="confirm"
                      data-confirm-message-value="Delete correspondent '{{ correspondent.name }}'?"
                      data-action="submit->confirm#confirm"
                      data-turbo-frame="correspondents-list">
                    <button type="submit" class="manage-btn-delete">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </form>
            </div>
            <div class="manage-edit-form">
                <form action="/manage/correspondents/{{ correspondent.id }}/update" method="post"
                      data-turbo-frame="correspondents-list">
                    <input type="text" name="name" value="{{ correspondent.name }}" required>
                    <div class="manage-edit-actions">
                        <button type="submit" class="btn-small">Save</button>
                        <button type="button" class="btn-small btn-secondary"
                                onclick="this.closest('.manage-edit-form').classList.remove('active')">Cancel</button>
                    </div>
                </form>
            </div>
        </li>
        {% endfor %}
        {% endif %}
    </ul>
</turbo-frame>
