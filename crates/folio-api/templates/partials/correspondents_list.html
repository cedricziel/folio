{% import "partials/icons.html" as icons %}
<turbo-frame id="correspondents-list">
    <ul class="manage-list">
        {% if correspondents.is_empty() %}
        <li class="manage-list-empty">No one yet</li>
        {% else %}
        {% for correspondent in correspondents %}
        <li class="manage-list-item" id="correspondent-{{ correspondent.id }}">
            <span class="manage-item-name">{{ correspondent.name }}</span>
            {% if true|can_manage %}
            <div class="manage-item-actions">
                <button type="button" class="f-btn f-btn-quiet icon-btn" aria-label="Rename correspondent {{ correspondent.name }}"
                        onclick="this.closest('li').querySelector('.manage-edit-form').classList.toggle('active')">{{ icons::pencil() }}</button>
                <form action="{{ "/manage/correspondents"|vault_url }}/{{ correspondent.id }}/delete" method="post" class="inline-form"
                      data-controller="confirm"
                      data-confirm-message-value="Delete correspondent '{{ correspondent.name }}'?"
                      data-action="submit->confirm#confirm"
                      data-turbo-frame="correspondents-list">
                    <button type="submit" class="f-btn f-btn-quiet f-btn-danger icon-btn" aria-label="Delete correspondent {{ correspondent.name }}">{{ icons::trash() }}</button>
                </form>
            </div>
            <div class="manage-edit-form">
                <form action="{{ "/manage/correspondents"|vault_url }}/{{ correspondent.id }}/update" method="post"
                      data-turbo-frame="correspondents-list">
                    <label class="sr-only" for="edit-correspondent-{{ correspondent.id }}">Name</label>
                    <input class="input" id="edit-correspondent-{{ correspondent.id }}" type="text" name="name" value="{{ correspondent.name }}" required>
                    <div class="manage-edit-actions">
                        <button type="submit" class="f-btn f-btn-primary">Save</button>
                        <button type="button" class="f-btn f-btn-quiet"
                                onclick="this.closest('.manage-edit-form').classList.remove('active')">Cancel</button>
                    </div>
                </form>
            </div>
            {% endif %}
        </li>
        {% endfor %}
        {% endif %}
    </ul>
</turbo-frame>
