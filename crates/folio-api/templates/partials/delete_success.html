<turbo-stream action="remove" target="document-{{ document_id }}">
</turbo-stream>

<turbo-stream action="replace" target="document-detail">
    <template>
        <turbo-frame id="document-detail">
            <div class="flash flash-success" data-controller="flash">
                ✓ Document deleted successfully!
                <button data-action="flash#dismiss">×</button>
            </div>
        </turbo-frame>
    </template>
</turbo-stream>
