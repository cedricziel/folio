<section class="panel" id="document-{{ document.id }}-text">
    <h2 class="heading">Text Folio read</h2>
    {% match document.content %}
    {% when Some with (content) %}
    <pre class="ocr">{{ content }}</pre>
    {% when None %}
    {% if failed %}
    <div class="f-notice f-notice-danger" role="status">
        <p>Text extraction did not finish. The original file is unchanged. Read it again, or move it to Trash.</p>
    </div>
    {% else %}
    <p><span class="f-status f-status-pending">{{ reading }}</span></p>
    {% endif %}
    {% endmatch %}
</section>
