<turbo-stream action="replace" target="ai-settings">
    <template>
        <turbo-frame id="ai-settings">
            <div class="settings-card">
                <h3>API Keys</h3>
                <p class="settings-description">Credentials for hosted OCR and embedding providers.</p>

                <div class="alert alert-success" data-controller="flash" data-flash-delay-value="5000">
                    Settings saved successfully!
                    <button type="button" class="alert-close" data-action="click->flash#dismiss">&times;</button>
                </div>

                <form action="/settings/ai" method="post"
                      data-controller="settings-form"
                      data-action="turbo:submit-start->settings-form#submit turbo:submit-end->settings-form#complete">

                    <div class="form-group" >
                        <label for="openai_api_key">OpenAI API Key</label>
                        <input type="password" id="openai_api_key" name="openai_api_key"
                               value="{{ ai_settings.openai_api_key }}"
                               placeholder="sk-...">
                        <span class="form-hint">Your OpenAI API key for GPT-4 Vision and embeddings</span>
                    </div>

                    <div class="form-group" >
                        <label for="anthropic_api_key">Anthropic API Key</label>
                        <input type="password" id="anthropic_api_key" name="anthropic_api_key"
                               value="{{ ai_settings.anthropic_api_key }}"
                               placeholder="sk-ant-...">
                        <span class="form-hint">Your Anthropic API key for Claude Vision</span>
                    </div>

                    <div class="form-actions">
                        <button type="submit" data-settings-form-target="button">Save Settings</button>
                        <span class="save-status" data-settings-form-target="status"></span>
                    </div>
                </form>
            </div>
        </turbo-frame>
    </template>
</turbo-stream>
