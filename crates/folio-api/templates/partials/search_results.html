<turbo-frame id="documents-list">
    <div class="f-list" id="documents-rows">
        {% for row in rows %}
        {% include "partials/document_row.html" %}
        {% endfor %}
    </div>
    {% if rows.is_empty() %}
    <div class="empty-state" id="documents-empty">
        <h2 class="heading">No matching documents.</h2>
        <p class="lede">Try different words.</p>
    </div>
    {% endif %}
</turbo-frame>
