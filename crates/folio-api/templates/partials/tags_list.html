{% import "partials/icons.html" as icons %}
<turbo-frame id="tags-list">
    <ul class="manage-list">
        {% if tags.is_empty() %}
        <li class="manage-list-empty">No tags yet</li>
        {% else %}
        {% for tag in tags %}
        <li class="manage-list-item" id="tag-{{ tag.id }}">
            <span class="manage-item-name"><span class="f-tag f-tag-{{ tag.tone() }}">{{ tag.name }}</span></span>
            {% if true|can_manage %}
            <div class="manage-item-actions">
                <button type="button" class="f-btn f-btn-quiet icon-btn" aria-label="Rename tag {{ tag.name }}"
                        onclick="this.closest('li').querySelector('.manage-edit-form').classList.toggle('active')">{{ icons::pencil() }}</button>
                <form action="{{ "/manage/tags"|vault_url }}/{{ tag.id }}/delete" method="post" class="inline-form"
                      data-controller="confirm"
                      data-confirm-message-value="Delete tag '{{ tag.name }}'?"
                      data-action="submit->confirm#confirm"
                      data-turbo-frame="tags-list">
                    <button type="submit" class="f-btn f-btn-quiet f-btn-danger icon-btn" aria-label="Delete tag {{ tag.name }}">{{ icons::trash() }}</button>
                </form>
            </div>
            <div class="manage-edit-form">
                <form action="{{ "/manage/tags"|vault_url }}/{{ tag.id }}/update" method="post"
                      data-turbo-frame="tags-list">
                    <label class="sr-only" for="edit-tag-{{ tag.id }}">Name</label>
                    <input class="input" id="edit-tag-{{ tag.id }}" type="text" name="name" value="{{ tag.name }}" required>
                    <div class="manage-edit-actions">
                        <button type="submit" class="f-btn f-btn-primary">Save</button>
                        <button type="button" class="f-btn f-btn-quiet"
                                onclick="this.closest('.manage-edit-form').classList.remove('active')">Cancel</button>
                    </div>
                </form>
            </div>
            {% endif %}
        </li>
        {% endfor %}
        {% endif %}
    </ul>
</turbo-frame>
