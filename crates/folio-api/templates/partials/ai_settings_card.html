<div class="panel settings-card">
    <h2 class="heading">API keys</h2>
    <p class="hint">Credentials for hosted reading and search providers.</p>

    {% if saved %}
    <div class="f-notice settings-saved" role="status" data-controller="flash" data-flash-delay-value="5000">
        <p>Settings saved.</p>
    </div>
    {% endif %}

    <form action="/settings/ai" method="post"
          data-controller="settings-form"
          data-action="turbo:submit-start->settings-form#submit turbo:submit-end->settings-form#complete">

        <div class="field">
            <label for="openai_api_key">OpenAI API key</label>
            <div class="input-row" data-controller="password-toggle">
                <input class="input" type="password" id="openai_api_key" name="openai_api_key"
                       value="{{ ai_settings.openai_api_key }}" placeholder="sk-..."
                       autocomplete="off" data-password-toggle-target="input">
                <button type="button" class="f-btn" data-action="click->password-toggle#toggle" data-password-toggle-target="button">Show</button>
            </div>
            <span class="hint">Used by the openai-vision and openai providers.</span>
        </div>

        <div class="field">
            <label for="anthropic_api_key">Anthropic API key</label>
            <div class="input-row" data-controller="password-toggle">
                <input class="input" type="password" id="anthropic_api_key" name="anthropic_api_key"
                       value="{{ ai_settings.anthropic_api_key }}" placeholder="sk-ant-..."
                       autocomplete="off" data-password-toggle-target="input">
                <button type="button" class="f-btn" data-action="click->password-toggle#toggle" data-password-toggle-target="button">Show</button>
            </div>
            <span class="hint">Used by the anthropic-vision provider.</span>
        </div>

        <div class="form-actions">
            <button type="submit" class="f-btn f-btn-primary" data-settings-form-target="button">Save settings</button>
            <span class="hint" data-settings-form-target="status"></span>
        </div>
    </form>
</div>
