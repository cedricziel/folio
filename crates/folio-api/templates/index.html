{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="upload-section">
    <h2>Upload Document</h2>
    <turbo-frame id="upload-form">
        <form action="/documents/upload" method="post" enctype="multipart/form-data"
              data-controller="upload"
              data-action="turbo:submit-start->upload#submit turbo:submit-end->upload#reset"
              data-upload-target="form">
            <div class="form-group">
                <label for="title">Title (optional)</label>
                <input type="text" id="title" name="title" placeholder="Document title">
            </div>
            <div class="form-group">
                <label for="file">File</label>
                <input type="file" id="file" name="file" required accept="image/*,.pdf">
            </div>
            <button type="submit" data-upload-target="button">Upload</button>
            <span data-upload-target="status" class="upload-status"></span>
        </form>
    </turbo-frame>
</section>

<section class="search-section">
    <h2>Search Documents</h2>
    <form action="/documents/search" method="get" data-turbo-frame="documents-list">
        <div class="form-group">
            <input type="text" name="q" placeholder="Search documents..." required>
        </div>
        <button type="submit">Search</button>
        <a href="/" class="btn-secondary">Clear</a>
    </form>
</section>

<section class="documents-section">
    <h2>All Documents</h2>
    <turbo-frame id="documents-list">
        {% include "partials/documents_list.html" %}
    </turbo-frame>
    <turbo-frame id="document-detail">
    </turbo-frame>
</section>
{% endblock %}
