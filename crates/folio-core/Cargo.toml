[package]
name = "folio-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Derives utoipa::ToSchema on API-facing types so folio-api can publish an OpenAPI spec.
openapi = ["dep:utoipa"]

[dependencies]
# OpenAPI schemas (optional)
utoipa = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Async runtime (for broadcast channel)
tokio = { workspace = true }

# Webhook URL validation
url = "2"

# Source conditions and content hashing
regex = "1"
sha2 = { workspace = true }
hex = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
