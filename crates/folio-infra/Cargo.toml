[package]
name = "folio-infra"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Core domain
folio-core = { workspace = true }
folio-auth = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Configuration
figment = { workspace = true }
dotenvy = { workspace = true }

# Logging and telemetry
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

# HTTP client (AI APIs, Paperless)
reqwest = { workspace = true, features = ["query", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }

# Object storage
object_store = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }

# Image processing
image = { workspace = true }

# Webhook signing
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Symlink-free opens under an import directory
rustix = { version = "1", features = ["fs"] }

# Consume folder watching
notify = "8"

# Mailbox access
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = "1"
native-tls = "0.2"
tokio-native-tls = "0.3"

[features]
# Local ONNX embeddings (downloads onnxruntime and models); off by default to keep builds small
fastembed = ["dep:fastembed"]

[dependencies.fastembed]
version = "7"
optional = true

[dev-dependencies]
axum = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
wiremock = "0.6"
reqwest = { workspace = true, features = ["form", "multipart"] }
hmac = "0.13"
sha2 = "0.11"
